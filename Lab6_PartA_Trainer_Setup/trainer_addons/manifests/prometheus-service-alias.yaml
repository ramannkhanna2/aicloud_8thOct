# Creates the exact service DNS name used by Lab 6's KServe/KEDA example:
# http://prometheus.istio-system.svc.cluster.local:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: istio-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
